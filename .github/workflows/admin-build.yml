name: Admin build

on:
  pull_request:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/admin-build.yml"
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/admin-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
