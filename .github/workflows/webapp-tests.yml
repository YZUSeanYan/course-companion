name: Webapp tests

on:
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-tests.yml"
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Typecheck and production build
        run: npm run build
